prometheus:
  url: http://prometheus-server
  port: 80

rules:
  default: false
  custom:
  - seriesQuery: 'rabbitmq_queue_messages{namespace!="",pod!="",queue="task_queue"}'
    resources:
      overrides:
        namespace: {resource: "namespace"}
        pod: {resource: "pod"}
    metricsQuery: sum(<<.Series>>{<<.LabelMatchers>>,queue="task_queue"}) by (<<.GroupBy>>)
